[project]
name = "NemaDB"
version = "1.4.0"
description = "NemaDB"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.1",
]

[tool.flet.app]
path = "."
module = "main"
exclude = [
    ".git",
    ".flet",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

[tool.flet]
company = "NemaDB"
copyright = "Copyright (C) 2026 NemaDB"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
theme_mode = "light"
bgcolor_light = "#F5F7FB"
spinner_color_light = "#5B5CE2"
spinner_size = 32
text_color_light = "#182230"
startup_message = "NemaDB 正在启动，请稍候…\nNemaDB is starting, please wait…\n首次启动可能较慢 / First launch may take longer"
fade_out_duration = 250

[tool.flet.template]
# url = "./flet_build_template"

[tool.flet.build]
file_version = "1.4.0.0"
product_version = "1.4.0.0"
product_name = "NemaDB"
